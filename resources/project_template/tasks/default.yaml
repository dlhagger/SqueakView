task_name: SqueakView Default
schema_version: 1

events:
  - name: POKE
    match:
      event_contains: "POKE"
      phase: "start"
    split_by_side: true
    use_count_field: true
    plot: "Behavior"

  - name: DRINK
    match:
      event_contains: "DRINK"
      phase: "start"
    split_by_side: true
    use_count_field: true
    plot: "Behavior"

  - name: PELLET
    match:
      event_contains: "PELLET"
      phase: "retrieval"
    split_by_side: false
    plot: "Behavior"

  - name: WELL_CHECK
    match:
      event_contains: "WELL_CHECK"
      phase: "start"
    split_by_side: false
    plot: "Behavior"

dashboard:
  plots:
    - id: "Behavior"
      title: "Behavior Events"
      type: "event_raster"
      series:
        - "POKE_L"
        - "DRINK_L"
        - "POKE_R"
        - "DRINK_R"
        - "PELLET"
        - "WELL_CHECK"
