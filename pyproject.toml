[project]
name = "SqueakView_WSL"
version = "0.1.0"
description = "Direct FLIR Spinnaker/GStreamer source into NVIDIA DeepStream for SqueakView."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "onnx>=1.22.0",
    "onnxruntime-gpu>=1.30.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "tensorrt-cu13==10.16.0.72",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.152",
]

[project.scripts]
mousehouse-protocol-v2-test = "squeakview.tools.mousehouse_protocol_v2_test:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["squeakview*"]

[tool.uv]
torch-backend = "auto"
